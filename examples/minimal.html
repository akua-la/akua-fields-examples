<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout mínimo — Akua Fields</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; color: #0e1b25; }
    h1 { font-size: 20px; } button { width: 100%; font: inherit; font-weight: 600; color: #fff; background: #0e8c7f;
      border: none; border-radius: 8px; padding: 12px; margin-top: 10px; cursor: pointer; }
    button:disabled { opacity: .5; } pre { background: #0f1e28; color: #d8e4ea; border-radius: 8px; padding: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Pagar $100.000 COP</h1>
  <div id="akua-card"></div>
  <button id="pay" disabled>Pagar</button>
  <pre id="out">// resultado</pre>

  <!-- 1. apuntá al servicio de Akua Fields -->
  <script src="../config.js"></script>
  <!-- 2. cargá el SDK desde ese servicio -->
  <script>document.write('<scr'+'ipt src="'+window.AKUA_SF_BASE+'/akua-fields.js"><\/scr'+'ipt>');</script>
  <script>
    // 3. El token y la clave de cifrado los sirve TU backend (acá, server.js) —
    //    nunca se mintean en el navegador. Dual Encryption es obligatorio: sin
    //    encryptionPublicKey, mount() no tokeniza.
    Promise.all([
      fetch('/token').then(function (r) { return r.json(); }),
      fetch('/encryption-key').then(function (r) { return r.json(); }),
    ]).then(function (results) {
      var t = results[0], k = results[1];
      if (!t.token || !k.public_key) {
        out.textContent = 'Faltan credenciales: revisá AKUA_CLIENT_ID/SECRET en tu .env (ver .env.example).';
        return;
      }
      var sf = AkuaFields.mount('#akua-card', {
        apiBase: window.AKUA_SF_BASE,
        token: t.token,
        encryptionPublicKey: k.public_key,   // obligatorio
        amount: 100000, currency: 'COP',
        onReady:    function () { pay.disabled = false; },
        onValidity: function (ok) { pay.disabled = !ok; },
        onResult:   function (r) { out.textContent = JSON.stringify(r, null, 2); },
      });
      pay.onclick = function () { pay.disabled = true; sf.pay(); };
    });
  </script>
</body>
</html>
