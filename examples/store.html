<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punto de Pago Store — Checkout</title>
  <!--
    Este es el ejemplo que copiás para armar TU experiencia de checkout.
    Todo lo visual está en :root (colores) y en el HTML — cambialo libremente.
    Lo único "de Akua" es el <div id="akua-card"> (iframe de campos) y sf.pay().
  -->
  <style>
    :root {
      --brand:   #e96024;   /* color de marca / botón */
      --bg:      #eff0fb;
      --ink:     #0e1b25;
      --muted:   #6b7b87;
      --card-bg: #ffffff;
      --radius:  16px;
      --font:    'Poppins', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); margin: 0; }
    .top { background: #fff; border-bottom: 1px solid #e6e8f5; padding: 16px 24px; font-weight: 800; color: var(--brand); font-size: 18px; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 36px 20px 80px; display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
    .panel { background: var(--card-bg); border-radius: var(--radius); padding: 28px; flex: 1; min-width: 300px; box-shadow: 0 6px 28px rgba(14,27,37,.06); }
    h2 { font-size: 15px; margin: 0 0 18px; }
    .item { display: flex; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f1f6; }
    .thumb { width: 46px; height: 46px; border-radius: 10px; background: linear-gradient(135deg,var(--brand),#f0a072); flex-shrink: 0; }
    .item .name { flex: 1; font-size: 14px; } .item .name small { display: block; color: var(--muted); }
    .item .price { font-weight: 600; font-size: 14px; }
    .totals { margin-top: 14px; font-size: 14px; }
    .totals .row { display: flex; justify-content: space-between; padding: 6px 0; }
    .totals .row.grand { font-weight: 800; font-size: 17px; border-top: 1px solid #f0f1f6; margin-top: 6px; padding-top: 12px; }
    h1 { font-size: 22px; margin: 0 0 4px; } .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
    label.blk { display: block; font-size: 12px; font-weight: 600; color: #3a4a56; margin: 14px 0 5px; }
    input.txt { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid #d9e0e4; border-radius: 10px; outline: none; }
    input.txt:focus { border-color: var(--brand); }
    .pay { width: 100%; font: inherit; font-size: 15px; font-weight: 700; color: #fff; background: var(--brand);
      border: none; border-radius: 10px; padding: 14px; margin-top: 18px; cursor: pointer; }
    .pay:disabled { opacity: .5; cursor: default; }
    .msg { margin-top: 14px; font-size: 14px; padding: 11px 14px; border-radius: 10px; display: none; }
    .msg.ok { display: block; background: #e6f5ee; color: #177a4c; } .msg.err { display: block; background: #fbeae7; color: #b54b3a; }
    .secure { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
    pre { background: #0f1e28; color: #d8e4ea; border-radius: 10px; padding: 12px; font-size: 11px; overflow-x: auto; margin-top: 14px; }
  </style>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>
<body>
  <div class="top">Punto de Pago · Store</div>
  <div class="wrap">
    <!-- Columna izquierda: TU carrito / resumen (100% tuyo, cambialo) -->
    <div class="panel">
      <h2>Tu carrito</h2>
      <div class="item"><div class="thumb"></div><div class="name">Zapatillas Runner Pro<small>Talle 42 · Negro</small></div><div class="price">$ 90.000</div></div>
      <div class="item"><div class="thumb"></div><div class="name">Medias deportivas x3<small>Pack</small></div><div class="price">$ 10.000</div></div>
      <div class="totals">
        <div class="row"><span>Subtotal</span><span>$ 100.000</span></div>
        <div class="row"><span>Envío</span><span>Gratis</span></div>
        <div class="row grand"><span>Total</span><span>$ 100.000 COP</span></div>
      </div>
    </div>

    <!-- Columna derecha: TU form de pago. Los datos del comprador son tuyos;
         solo la tarjeta es el iframe de Akua Fields. -->
    <div class="panel">
      <h1>Finalizar compra</h1>
      <p class="sub">Pago seguro — tus datos de tarjeta los protege Akua</p>

      <label class="blk">Nombre</label>
      <input class="txt" id="cust-name" placeholder="Tu nombre" value="Cliente Demo">

      <label class="blk">Email</label>
      <input class="txt" id="email" type="email" placeholder="vos@email.com" value="cliente@example.com">

      <label class="blk">Datos de la tarjeta</label>
      <div id="akua-card"></div>

      <button class="pay" id="pay" disabled>Pagar $ 100.000</button>
      <div class="msg" id="msg"></div>
      <div class="secure">🔒 Procesado de forma segura</div>
      <pre id="out">// respuesta del pago</pre>
    </div>
  </div>

  <script src="../config.js"></script>
  <script>document.write('<scr'+'ipt src="'+window.AKUA_SF_BASE+'/akua-fields.js"><\/scr'+'ipt>');</script>
  <script>
    var msg = document.getElementById('msg'), out = document.getElementById('out'), pay = document.getElementById('pay');
    var sf = AkuaFields.mount('#akua-card', {
      apiBase: window.AKUA_SF_BASE,
      // White-label: los campos toman la marca de este cliente (color + fuente)
      // desde su brand config. Cambialo por el brandClientId (cli-…) de tu cliente.
      brandClientId: window.AKUA_BRAND_CLIENT_ID || 'cli-d6u5i86oac8gglnedq10',
      amount: 100000, currency: 'COP',
      orderId: 'store-' + Date.now(),
      onReady:    function () { pay.disabled = false; },
      onValidity: function (ok) { pay.disabled = !ok; },
      onResult:   function (r) {
        out.textContent = JSON.stringify(r, null, 2);
        if (r.status === 'APPROVED' || r.status === 'AUTHORIZED') {
          var u = r.user_id ? ' · cliente ' + r.user_id : '';
          msg.className = 'msg ok'; msg.textContent = '✅ ¡Compra confirmada! Pago ' + r.status + u;
        } else {
          msg.className = 'msg err'; msg.textContent = '❌ ' + (r.message || r.error || r.status || 'Pago rechazado');
        }
        pay.disabled = false; pay.textContent = 'Pagar $ 100.000';
      },
    });
    pay.onclick = function () {
      pay.disabled = true; pay.textContent = 'Procesando…'; msg.className = 'msg';
      // La info del usuario viaja en el pago → Akua crea el usuario y le asigna
      // la tarjeta tokenizada. Es OPCIONAL: sin esto, el pago funciona igual.
      sf.pay({ user: {
        name: document.getElementById('cust-name').value,
        email: document.getElementById('email').value,
      } });
    };
  </script>
</body>
</html>
